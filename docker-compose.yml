# Docker Compose configuration for Geoff Miller Platform development
version: '3.8'

services:
  # Development server with hot reloading
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev-watch
    container_name: geoff-platform-dev
    ports:
      - "4321:4321"
    volumes:
      # Mount source code for hot reloading
      - ./src:/app/src:cached
      - ./public:/app/public:cached
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - ./astro.config.mjs:/app/astro.config.mjs:ro
      - ./tailwind.config.mjs:/app/tailwind.config.mjs:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      # Use named volume for node_modules to avoid host OS conflicts
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - ASTRO_TELEMETRY_DISABLED=1
      - CHOKIDAR_USEPOLLING=true  # Better file watching cross-platform
      - WATCHPACK_POLLING=true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4321/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - platform-network

  # Production build for testing
  prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: geoff-platform-prod
    ports:
      - "8080:80"
    environment:
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - platform-network
    profiles:
      - production

  # Nginx proxy for advanced development scenarios
  proxy:
    image: nginx:alpine
    container_name: geoff-platform-proxy
    ports:
      - "3000:80"
    volumes:
      - ./docker/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      dev:
        condition: service_healthy
    networks:
      - platform-network
    profiles:
      - proxy

volumes:
  node_modules:
    driver: local

networks:
  platform-network:
    driver: bridge
    name: geoff-platform-network