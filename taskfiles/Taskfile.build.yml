version: '3'

vars:
  BUILD_DIR: dist
  NODE_ENV: production

tasks:
  # Production build
  prod:
    desc: Build for production with all optimizations
    cmds:
      - echo "Building for production..."
      - npm run build
      - task: build:verify
      - echo "Production build complete!"
    sources:
      - "src/**/*"
      - "public/**/*"
      - "package.json"
      - "astro.config.mjs"
      - "tailwind.config.mjs"
      - "tsconfig.json"
    generates:
      - "{{.BUILD_DIR}}/**/*"

  # Development build
  dev:
    desc: Build for development
    cmds:
      - echo "Building for development..."
      - npm run build:dev
    sources:
      - "src/**/*"
      - "public/**/*"
    generates:
      - "{{.BUILD_DIR}}/**/*"

  # Clean build artifacts
  clean:
    desc: Clean build artifacts and cache
    cmds:
      - echo "Cleaning build artifacts..."
      - rm -rf {{.BUILD_DIR}}/
      - rm -rf .astro/
      - echo "Build artifacts cleaned"
    silent: true

  # Verify build
  verify:
    desc: Verify build output and quality
    cmds:
      - echo "Verifying build output..."
      - test -d {{.BUILD_DIR}} || (echo "Build directory not found" && exit 1)
      - test -f {{.BUILD_DIR}}/index.html || (echo "Index.html not found" && exit 1)
      - echo "Build verification complete"

  # Bundle analysis
  analyze:
    desc: Analyze bundle size and composition
    deps: [prod]
    cmds:
      - echo "Analyzing bundle size..."
      - npm run analyze
      - echo "Bundle analysis complete"

  # Sitemap generation
  sitemap:
    desc: Generate sitemap for SEO
    deps: [prod]
    cmds:
      - echo "Sitemap generated during build process"
      - test -f {{.BUILD_DIR}}/sitemap-index.xml || echo "Warning - sitemap not found"

  # Optimize images
  optimize-images:
    desc: Optimize images for web delivery
    cmds:
      - echo "Optimizing images..."
      - npm run optimize:images
    sources:
      - "src/assets/**/*.{jpg,jpeg,png,webp,svg}"
      - "public/**/*.{jpg,jpeg,png,webp,svg}"

  # Generate RSS feeds
  rss:
    desc: Generate RSS feeds for content
    deps: [prod]
    cmds:
      - echo "RSS feeds generated during build process"
      - test -f {{.BUILD_DIR}}/rss.xml || echo "Warning - RSS feed not found"

  # Build stats
  stats:
    desc: Generate build statistics
    deps: [prod]
    cmds:
      - echo "Generating build statistics..."
      - echo "Build directory size:"
      - du -sh {{.BUILD_DIR}}
      - echo "File count:"
      - find {{.BUILD_DIR}} -type f | wc -l

  # Pre-build setup
  prebuild:
    desc: Setup tasks before building
    cmds:
      - echo "Running pre-build setup..."
      - npm run type-check
      - npm run lint
      - echo "Pre-build checks complete"

  # Post-build tasks
  postbuild:
    desc: Tasks to run after building
    deps: [verify, stats]
    cmds:
      - echo "Running post-build tasks..."
      - echo "Build process completed successfully"

  # Build for different environments
  staging:
    desc: Build for staging environment
    env:
      NODE_ENV: staging
      ASTRO_BUILD_ENV: staging
    cmds:
      - echo "Building for staging..."
      - npm run build
      - echo "Staging build complete"

  # Fast build (skip optimization)
  fast:
    desc: Fast build for development testing
    cmds:
      - echo "Running fast build..."
      - npm run build:fast
    sources:
      - "src/**/*"
    generates:
      - "{{.BUILD_DIR}}/**/*"

  # Watch build
  watch:
    desc: Watch files and rebuild automatically
    cmds:
      - echo "Starting watch build..."
      - npm run build:watch