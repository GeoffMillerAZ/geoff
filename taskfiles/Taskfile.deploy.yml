version: '3'

vars:
  DEPLOY_DIR: dist
  STAGING_URL: https://staging.geoffmiller.dev
  PRODUCTION_URL: https://geoffmiller.dev

tasks:
  # Deploy to staging
  staging:
    desc: Deploy to staging environment
    deps: [build:prod]
    cmds:
      - echo "Deploying to staging..."
      - npm run deploy:staging
      - echo "Staging deployment complete"
      - echo "Available at {{.STAGING_URL}}"

  # Deploy to production
  production:
    desc: Deploy to production environment
    deps: [build:prod, test:ci]
    cmds:
      - echo "Deploying to production..."
      - npm run deploy:production
      - echo "Production deployment complete"
      - echo "Available at {{.PRODUCTION_URL}}"

  # Preview deployment
  preview:
    desc: Create preview deployment
    deps: [build:prod]
    cmds:
      - echo "Creating preview deployment..."
      - npm run deploy:preview
      - echo "Preview deployment complete"

  # Deploy to Vercel
  vercel:
    desc: Deploy using Vercel CLI
    deps: [build:prod]
    cmds:
      - echo "Deploying with Vercel..."
      - vercel --prod
      - echo "Vercel deployment complete"

  # Deploy to Netlify
  netlify:
    desc: Deploy using Netlify CLI
    deps: [build:prod]
    cmds:
      - echo "Deploying with Netlify..."
      - netlify deploy --prod --dir={{.DEPLOY_DIR}}
      - echo "Netlify deployment complete"

  # Deploy to GitHub Pages
  github-pages:
    desc: Deploy to GitHub Pages
    deps: [build:prod]
    cmds:
      - echo "Deploying to GitHub Pages..."
      - npm run deploy:github-pages
      - echo "GitHub Pages deployment complete"

  # Rollback deployment
  rollback:
    desc: Rollback to previous deployment
    cmds:
      - echo "Rolling back deployment..."
      - npm run deploy:rollback
      - echo "Rollback complete"

  # Check deployment status
  status:
    desc: Check deployment status
    cmds:
      - echo "Checking deployment status..."
      - curl -I {{.PRODUCTION_URL}} || echo "Production site unreachable"
      - curl -I {{.STAGING_URL}} || echo "Staging site unreachable"

  # Deployment health check
  health:
    desc: Run post-deployment health checks
    cmds:
      - echo "Running health checks..."
      - npm run test:health
      - echo "Health checks complete"

  # Warm up deployment
  warmup:
    desc: Warm up deployed site
    cmds:
      - echo "Warming up deployment..."
      - curl -s {{.PRODUCTION_URL}} > /dev/null
      - curl -s {{.PRODUCTION_URL}}/blog > /dev/null
      - curl -s {{.PRODUCTION_URL}}/guides > /dev/null
      - echo "Site warmed up"

  # Clean deployment artifacts
  clean:
    desc: Clean deployment artifacts
    cmds:
      - echo "Cleaning deployment artifacts..."
      - rm -rf {{.DEPLOY_DIR}}
      - rm -rf .vercel
      - rm -rf .netlify
      - echo "Deployment artifacts cleaned"

  # Deployment metrics
  metrics:
    desc: Collect deployment metrics
    cmds:
      - echo "Collecting deployment metrics..."
      - npm run collect:metrics
      - echo "Metrics collected"

  # Notify deployment
  notify:
    desc: Send deployment notifications
    cmds:
      - echo "Sending deployment notifications..."
      - npm run notify:deployment
      - echo "Notifications sent"

  # Full deployment pipeline
  pipeline:
    desc: Run complete deployment pipeline
    cmds:
      - task: deploy:staging
      - task: deploy:health
      - task: deploy:production
      - task: deploy:warmup
      - task: deploy:notify
      - echo "Deployment pipeline complete"