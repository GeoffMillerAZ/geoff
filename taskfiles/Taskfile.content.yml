version: '3'

vars:
  CONTENT_DIR: src/content
  BLOG_DIR: src/content/blog
  PROJECTS_DIR: src/content/projects
  GUIDES_DIR: src/content/guides
  RESOURCES_DIR: src/content/resources

tasks:
  # Create new blog post
  new-blog:
    desc: Create a new blog post
    cmds:
      - node scripts/new-blog.mjs "{{.CLI_ARGS}}"
    preconditions:
      - sh: test -d {{.BLOG_DIR}}
        msg: "Blog directory not found"

  # Create new project
  new-project:
    desc: Create a new project showcase
    cmds:
      - node scripts/new-project.mjs "{{.CLI_ARGS}}"
    preconditions:
      - sh: test -d {{.PROJECTS_DIR}}
        msg: "Projects directory not found"

  # Create new guide
  new-guide:
    desc: Create a new guide
    cmds:
      - node scripts/new-guide.mjs "{{.CLI_ARGS}}"
    preconditions:
      - sh: test -d {{.GUIDES_DIR}}
        msg: "Guides directory not found"

  # Create new resource
  new-resource:
    desc: Create a new resource entry
    cmds:
      - node scripts/new-resource.mjs "{{.CLI_ARGS}}"
    preconditions:
      - sh: test -d {{.RESOURCES_DIR}}
        msg: "Resources directory not found"

  # Validate all content
  validate:
    desc: Validate all content schemas and structure
    cmds:
      - echo "Validating content schemas..."
      - npm run validate:content
      - echo "Content validation complete"

  # Generate content
  generate:
    desc: Generate content collections and types
    cmds:
      - echo "Generating content collections..."
      - npm run generate:content
    sources:
      - "{{.CONTENT_DIR}}/config.ts"
    generates:
      - ".astro/types.d.ts"

  # Check content quality
  quality:
    desc: Check content quality and consistency
    cmds:
      - echo "Checking content quality..."
      - npm run lint:content
      - npm run check:links
      - echo "Content quality check complete"

  # Content statistics
  stats:
    desc: Show content statistics
    cmds:
      - echo "Content Statistics"
      - echo "=================="
      - echo "Blog posts - $(find {{.BLOG_DIR}} -name '*.mdx' | wc -l)"
      - echo "Projects - $(find {{.PROJECTS_DIR}} -name '*.mdx' | wc -l)"
      - echo "Guides - $(find {{.GUIDES_DIR}} -name '*.mdx' | wc -l)"
      - echo "Resources - $(find {{.RESOURCES_DIR}} -name '*.mdx' | wc -l)"

  # Build content index
  index:
    desc: Build content search index
    cmds:
      - echo "Building content search index..."
      - npm run build:index
    sources:
      - "{{.CONTENT_DIR}}/**/*.{md,mdx}"
    generates:
      - "public/search-index.json"

  # Export content
  export:
    desc: Export content for external use
    cmds:
      - echo "Exporting content..."
      - npm run export:content
    generates:
      - "exports/content.json"

  # Import content
  import:
    desc: Import content from external sources
    cmds:
      - echo "Importing content..."
      - npm run import:content

  # Clean content cache
  clean:
    desc: Clean content processing cache
    cmds:
      - echo "Cleaning content cache..."
      - rm -rf .astro/content/
      - echo "Content cache cleaned"

  # Preview content
  preview:
    desc: Preview content in development mode
    cmds:
      - echo "Starting content preview..."
      - npm run dev -- --experimental-content-preview

  # Content backup
  backup:
    desc: Backup all content
    cmds:
      - echo "Creating content backup..."
      - tar -czf "backups/content-$(date +%Y%m%d-%H%M%S).tar.gz" {{.CONTENT_DIR}}
      - echo "Content backup complete"

  # Restore content
  restore:
    desc: Restore content from backup
    cmds:
      - echo "Restoring content from backup..."
      - tar -xzf "{{.CLI_ARGS}}" -C .
      - echo "Content restore complete"

  # Check content freshness
  freshness:
    desc: Check content freshness and update dates
    cmds:
      - echo "Checking content freshness..."
      - find {{.CONTENT_DIR}} -name "*.mdx" -mtime +30 | head -10
      - echo "Content freshness check complete"

  # Tag management
  tags:
    desc: Analyze and manage content tags
    cmds:
      - echo "Analyzing content tags..."
      - npm run analyze:tags
      - echo "Tag analysis complete"

  # Content migration
  migrate:
    desc: Migrate content to new schema
    cmds:
      - echo "Migrating content schemas..."
      - npm run migrate:content
      - echo "Content migration complete"