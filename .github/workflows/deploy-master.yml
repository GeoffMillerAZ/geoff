name: Deploy to Master Branch

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: |
          npx astro build
          echo "dev.geoffmiller.cloud" > dist/CNAME
          touch dist/.nojekyll

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global core.autocrlf false

      - name: Deploy to master branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Save current directory
          CURRENT_DIR=$(pwd)
          
          # Move to dist directory
          cd dist
          
          # Initialize new git repo in dist
          git init
          git add -A
          git commit -m "Deploy from dev branch - $(date +'%Y-%m-%d %H:%M:%S')"
          
          # Force push to master branch
          git push -f https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:master
          
          echo "✅ Deployment complete"
          
          # Return to original directory
          cd "$CURRENT_DIR"
          
          # Also try to update master directly if possible
          git fetch origin master:master || true
          git checkout master || true
          
          # Clean master branch
          find . -maxdepth 1 ! -name '.git' ! -name 'dist' ! -name '.' -exec rm -rf {} +
          
          # Copy dist contents to root
          cp -r dist/* . || true
          rm -rf dist
          
          # Commit and push
          git add -A
          git commit -m "Update master with built site - $(date +'%Y-%m-%d %H:%M:%S')" || true
          git push origin master --force || true
          
          # Switch back to dev
          git checkout dev