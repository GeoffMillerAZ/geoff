name: Deploy to GitHub Pages

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: |
          npx astro build --skip-check
          echo "dev.geoffmiller.cloud" > dist/CNAME
          touch dist/.nojekyll

      - name: Deploy to master branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global core.autocrlf false
          
          # Move to dist directory
          cd dist
          
          # Initialize new git repo in dist
          git init
          git add -A
          git commit -m "🚀 Deploy from dev branch - $(date +'%Y-%m-%d %H:%M:%S')"
          
          # Force push to master branch
          git remote add origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git push -f origin HEAD:master
          
          echo "✅ Deployment complete to dev.geoffmiller.cloud"