# Dev Deploy Workflow
# 
# Triggers: Push or merge to 'dev' branch
# Output: Static site deployed to 'master' branch of this repository
# Domain: https://dev.geoffmiller.cloud
# 
# Rollback: Force push a previous commit to master branch or rerun a previous workflow
# 
# GitHub Pages Configuration Required:
# - Source: Deploy from branch (master)
# - Folder: / (root)
# - Custom domain: dev.geoffmiller.cloud
# - Enforce HTTPS: Enabled

name: Deploy Dev Site

on:
  push:
    branches:
      - dev
      - bugfix/ci-deployment-fix  # Temporary for testing
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build Astro site
        run: |
          echo "🔨 Building Astro site..."
          # Build without type checking - using astro build directly
          npx astro build
          echo "✅ Build completed successfully"
          
      - name: Verify build output
        run: |
          echo "📁 Checking dist folder..."
          if [ ! -d "dist" ]; then
            echo "❌ ERROR: dist folder not found!"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "❌ ERROR: index.html not found in dist!"
            exit 1
          fi
          echo "✅ Build output verified"
          ls -la dist/ | head -20
      
      - name: Prepare deployment files
        run: |
          echo "📝 Preparing deployment files..."
          
          # Create CNAME file for custom domain
          echo "dev.geoffmiller.cloud" > dist/CNAME
          echo "✅ Created CNAME file: dev.geoffmiller.cloud"
          
          # Create .nojekyll to support underscore paths
          touch dist/.nojekyll
          echo "✅ Created .nojekyll file"
          
          # List files to be deployed
          echo "📋 Files to be deployed:"
          find dist -type f | head -50
          echo ""
          echo "📊 Deployment statistics:"
          echo "Total files: $(find dist -type f | wc -l)"
          echo "Total size: $(du -sh dist | cut -f1)"
      
      - name: Deploy to GitHub Pages branch
        run: |
          echo "🚀 Deploying to master branch..."
          
          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Move to dist folder
          cd dist
          
          # Initialize git repo
          git init
          
          # Create initial commit on orphan branch
          git checkout --orphan master
          
          # Add all files
          git add -A
          
          # Create commit
          git commit -m "Deploy dev site from commit ${GITHUB_SHA::7} [skip ci]"
          
          # Add remote and push
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          
          # Force push to master branch
          git push -f origin master
          
          echo "✅ Deployment complete!"
      
      - name: Verify deployment
        run: |
          echo "🔍 Deployment verification"
          echo "=========================================="
          echo "✅ Site deployed to: https://dev.geoffmiller.cloud"
          echo ""
          echo "⚠️  IMPORTANT: Verify GitHub Pages settings:"
          echo "1. Go to: https://github.com/${{ github.repository }}/settings/pages"
          echo "2. Ensure these settings:"
          echo "   - Source: Deploy from a branch"
          echo "   - Branch: master / (root)"
          echo "   - Custom domain: dev.geoffmiller.cloud"
          echo "   - Enforce HTTPS: ✓ Enabled"
          echo ""
          echo "🔄 To rollback: Re-run a previous successful workflow from the Actions tab"
          echo "=========================================="
      
      - name: Check deployment status
        if: always()
        run: |
          # Wait a moment for GitHub Pages to process
          sleep 10
          
          echo "🌐 Checking deployment status..."
          
          # Check if CNAME is accessible
          if curl -s -o /dev/null -w "%{http_code}" "https://raw.githubusercontent.com/${{ github.repository }}/master/CNAME" | grep -q "200"; then
            echo "✅ CNAME file is accessible on master branch"
          else
            echo "⚠️  CNAME file may not be accessible yet"
          fi
          
          # Check if index.html is accessible
          if curl -s -o /dev/null -w "%{http_code}" "https://raw.githubusercontent.com/${{ github.repository }}/master/index.html" | grep -q "200"; then
            echo "✅ index.html is accessible on master branch"
          else
            echo "⚠️  index.html may not be accessible yet"
          fi# Trigger CI/CD
