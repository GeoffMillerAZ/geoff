name: Test Direct Push

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Test push to master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create a test file
          echo "Test deployment at $(date)" > test.txt
          
          # Initialize git
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create test commit
          git add test.txt
          git commit -m "Test push at $(date)"
          
          # Try to push to master
          git push -f https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:master-test
          
          echo "If this succeeds, we can push to branches"